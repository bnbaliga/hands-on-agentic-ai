[project]
name = "hands-on-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Narasimha", email = "bnbaliga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    "crewai>=1.15.23",
    "crewai-tools>=1.15.23",
    "ddgs>=9.16.0",
    "google-generativeai>=0.8.6",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
hands-on-agentic-ai = "hands_on_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
