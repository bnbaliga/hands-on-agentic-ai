[project]
name = "hands-on-agentic-ai"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "crewai",
    "crewai-tools",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "psycopg>=3.2.13",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.39.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]
